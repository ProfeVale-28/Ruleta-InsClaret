<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta Instituto Claret - Completa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: #89b4fa; font-size: 30px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { color: #a6adc8; font-size: 15px; }
        
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        select, button {
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-weight: 600;
        }
        select {
            background: #313244;
            color: #cdd6f4;
            border: 1px solid #45475a;
            cursor: pointer;
        }
        .btn-spin {
            background: #a6e3a1;
            color: #11111b;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(166, 227, 161, 0.4);
            transition: all 0.2s ease;
        }
        .btn-spin:hover { transform: scale(1.05); background: #94e28f; }
        .btn-spin:active { transform: scale(0.98); }

        .btn-reset {
            background: #f38ba8;
            color: #11111b;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-reset:hover { transform: scale(1.05); background: #e78284; }

        #wheel-container {
            position: relative;
            width: 480px;
            height: 480px;
            max-width: 90vw;
            max-height: 90vw;
            margin-top: 10px;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        #pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 28px solid #f38ba8;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-card {
            background: #313244;
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
            border: 2px solid #89b4fa;
            max-width: 90%;
            width: 420px;
        }
        .modal-card h2 { color: #fab387; margin-bottom: 10px; font-size: 22px; }
        .modal-card p { font-size: 26px; font-weight: bold; color: #89b4fa; margin: 20px 0; }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-remove {
            background: #f38ba8;
            color: #11111b;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-keep {
            background: #89b4fa;
            color: #11111b;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-remove:hover, .btn-keep:hover { transform: scale(1.05); }
    </style>
</head>

        let activeDatabase = JSON.parse(JSON.stringify(originalDatabase));

        const colors = [
            '#89b4fa', '#f38ba8', '#a6e3a1', '#fab387', '#cba6f7', 
            '#74c7ec', '#f9e2af', '#b4befe', '#e5c89b', '#81c8be'
        ];
        
        const courseSelect = document.getElementById('course-select');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spin-btn');
        const resetBtn = document.getElementById('reset-btn');

        let currentCourseKey = "";
        let currentNames = [];
        let currentAngle = 0;
        let isSpinning = false;
        let lastWinnerIndex = -1;

        function initCourses() {
            courseSelect.innerHTML = '';
            for (let course in activeDatabase) {
                const opt = document.createElement('option');
                opt.value = course;
                opt.textContent = course + ' (' + activeDatabase[course].length + ' alumnos)';
                courseSelect.appendChild(opt);
            }
            loadCourse(courseSelect.value);
        }

        function updateSelectOptionLabel(courseKey) {
            const count = activeDatabase[courseKey].length;
            for (let option of courseSelect.options) {
                if (option.value === courseKey) {
                    option.textContent = courseKey + ' (' + count + ' alumnos)';
                    break;
                }
            }
        }

        function loadCourse(courseName) {
            currentCourseKey = courseName;
            currentNames = activeDatabase[courseName] || [];
            currentAngle = 0;
            drawWheel();
        }

        function drawWheel() {
            const numSlices = currentNames.length;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX - 12;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (numSlices === 0) {
                ctx.fillStyle = "#a6adc8";
                ctx.font = "bold 20px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("¡No quedan alumnos activos!", centerX, centerY);
                return;
            }

            const sliceAngle = (2 * Math.PI) / numSlices;

            for (let i = 0; i < numSlices; i++) {
                const startAngle = currentAngle + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#1e1e2e';
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#11111b";
                
                let fontSize = 13;
                if (numSlices > 35) {
                    fontSize = 9;
                } else if (numSlices > 25) {
                    fontSize = 11;
                }
                ctx.font = "bold " + fontSize + "px sans-serif";
                
                ctx.fillText(currentNames[i], radius - 15, 4);
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(centerX, centerY, 35, 0, 2 * Math.PI);
            ctx.fillStyle = '#181825';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#89b4fa';
            ctx.stroke();
        }

        function spin() {
            if (isSpinning || currentNames.length === 0) return;
            isSpinning = true;

            const spinRotations = 6 + Math.random() * 4;
            const randomOffset = Math.random() * 2 * Math.PI;
            const totalRotation = spinRotations * 2 * Math.PI + randomOffset;
            
            let start = null;
            const duration = 4000;

            function animate(timestamp) {
                if (!start) start = timestamp;
                const progress = (timestamp - start) / duration;

                if (progress < 1) {
                    const easeOut = 1 - Math.pow(1 - progress, 4);
                    currentAngle = easeOut * totalRotation;
                    drawWheel();
                    requestAnimationFrame(animate);
                } else {
                    currentAngle = totalRotation % (2 * Math.PI);
                    drawWheel();
                    isSpinning = false;
                    showWinner();
                }
            }

            requestAnimationFrame(animate);
        }

        function showWinner() {
            const numSlices = currentNames.length;
            const sliceAngle = (2 * Math.PI) / numSlices;
            const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI)) - Math.PI / 2) % (2 * Math.PI);
            let positiveAngle = normalizedAngle < 0 ? normalizedAngle + 2 * Math.PI : normalizedAngle;
            
            lastWinnerIndex = Math.floor(positiveAngle / sliceAngle);
            document.getElementById('winner-name').innerText = currentNames[lastWinnerIndex];
            document.getElementById('winner-modal').style.display = 'flex';
        }

        function removeWinner() {
            if (lastWinnerIndex >= 0 && lastWinnerIndex < currentNames.length) {
                currentNames.splice(lastWinnerIndex, 1);
                updateSelectOptionLabel(currentCourseKey);
                currentAngle = 0;
                drawWheel();
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('winner-modal').style.display = 'none';
        }

        function resetCurrentCourse() {
            if (confirm("¿Deseas restaurar todos los estudiantes para " + currentCourseKey + "?")) {
                activeDatabase[currentCourseKey] = [...originalDatabase[currentCourseKey]];
                updateSelectOptionLabel(currentCourseKey);
                loadCourse(currentCourseKey);
            }
        }

        courseSelect.addEventListener('change', (e) => loadCourse(e.target.value));
        spinBtn.addEventListener('click', spin);
        resetBtn.addEventListener('click', resetCurrentCourse);

        initCourses();
    </script>
